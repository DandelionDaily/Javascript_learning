<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
   
    <title>Guess The Number</title>
    <style>
      body{
        width:300px;
        max-width:750px;
        min-width:480px;
        margin: 0 auto;
        background-color:lightslategray;
        color:white;
        font-size:20px;
        text-align:center;
        font-family: sans-serif;
      }
      .lastResult, .guesses{
        margin-top:50px;
        padding:7px;
      }
      #submit{
        background-color:rgb(8, 52, 207);
        color:white;
        border:none;
        border-radius:20px;
        height:50px;
        width:200px;
        font-size:20px;
        margin-top:50px;
        margin-right:30px;
       
      }
      #guessField{
        color: black;
        width:250px;
        height:50px;
        font-size:30px;
        margin-top:35px;
        margin-right:50px;
         margin-left:50px;
        border:5px solid rgb(65, 81, 100);
        border-radius:5px;
      }
      #guess{
        font-size:50px;
        margin-top:150px;
      }
      .guesses{
        background-color:rgb(224, 223, 221);
      }
            
      button {
        background-color: #141414;
        color: #fff;
        width: 250px;
        height: 50px;
        border-radius: 25px;
        font-size: 30px;
        border-style: none;
        margin-top: 30px;
        
      }
      

    </style>
</head>
<body>
  <div id="wrapper">
    <h1>Number Guessing Game</h1>
    <p> Try and guess a random number between 1 and 100.</p>
    <p>You have 10 attempts to guess the right number.</p>
  </br>
     <form class="form">
      <label for="guessField" id="guess">Guess a number</label>
      <input type="text" id="guessField" class="guessField">
      <input type="submit" id="submit" value="Submit Guess" class="guessSubmit">
      
     </form>
  </div>
  <div class="result">
    <p>Previous Guesses: <span class="guesses"></span></p>
    <p>Guesses Remaining: <span class="lastResult">10</span></p>
    <p class="lowOrHig"></p>
    
  </div>
</body>
<script src="guessNumber.js"></script>

</html>
